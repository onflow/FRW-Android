// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 28
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.5.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")

        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
        classpath 'com.instabug.library:instabug-plugin:12.0.0'
        classpath 'com.google.firebase:firebase-appdistribution-gradle:5.0.0'
        // Google Play Publisher plugin for uploading AAB to Play Console
        classpath 'com.github.triplet.gradle:play-publisher:3.10.1'
    }
}

plugins {
    id 'com.google.devtools.ksp' version '2.1.20-2.0.1' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20' apply false
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven {
            url = uri("https://maven.pkg.github.com/trustwallet/wallet-core")
            credentials {
                username = System.getenv("GITHUB_USERNAME") ?: ""
                password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("github.token") ?: ""
            }
        }
        // Flow Wallet Kit (Android) from GitHub Packages
        maven {
            url = uri("https://maven.pkg.github.com/onflow/Flow-Wallet-Kit")
            credentials {
                // Prefer Gradle properties (gpr.user/gpr.key), fallback to env vars
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
